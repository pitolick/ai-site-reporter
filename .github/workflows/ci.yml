name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: 漏洩ガード環境変数の確認（push は同一リポジトリなので必須）
        if: github.event_name == 'push'
        env:
          LEAK_GUARD_WORDS: ${{ secrets.LEAK_GUARD_WORDS }}
        run: |
          if [ -z "$LEAK_GUARD_WORDS" ]; then
            echo "エラー: LEAK_GUARD_WORDS secret が未設定です。push イベントは fork ではなく secret が使えるはずなので、未設定は設定漏れです。" >&2
            exit 1
          fi
          # ドメイン検査（ドット付きエントリ）が無効のままでないか確認
          HAS_DOMAIN_ENTRY="$(echo "$LEAK_GUARD_WORDS" | grep -o '\.' || true)"
          if [ -z "$HAS_DOMAIN_ENTRY" ]; then
            echo "エラー: LEAK_GUARD_WORDS にドット付きエントリ（ドメイン検査対象）が無いため、ドメイン検査が無効のまま CI が走ります。ドメイン検査を有効にするには、環境変数に <サブドメイン>.<運営ドメイン> の形式を含めてください。" >&2
            exit 1
          fi
      - run: npm test
        env:
          LEAK_GUARD_WORDS: ${{ secrets.LEAK_GUARD_WORDS }}

  dependabot-auto-merge:
    needs: quality
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: メタデータ取得
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: patch / dev minor / GitHub Actions minor を自動マージ
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
           steps.metadata.outputs.dependency-type == 'direct:development') ||
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
           steps.metadata.outputs.package-ecosystem == 'github_actions')
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
